services:
  postgres:
    image: postgres:15
    container_name: agmp_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agmp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  djangoapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agmp_django
    restart: unless-stopped
    entrypoint: []
    command: bash -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn african_genomics_medicine_portal.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 300"
    volumes:
      - static_volume:/agmp/static_cdn
      - media_volume:/agmp/media
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agmp_network
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432

  nginx:
    image: nginx:latest
    container_name: agmp_nginx
    restart: unless-stopped
    ports:
      - "18082:80"
    volumes:
      - ./nginx/config.d/local.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/agmp/static_cdn:ro
      - media_volume:/agmp/media:ro
    depends_on:
      - djangoapp
    networks:
      - agmp_network

networks:
  agmp_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume: